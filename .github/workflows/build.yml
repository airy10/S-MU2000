# Build every target on every platform, on each commit.
#
# ROMs are local-only and never committed, so the audio tests skip
# themselves here (run_tests.py says so out loud); what CI does check on
# every commit is: full compilation with -Wformat-security clean, the
# localization tables (tools/check_texts.py, no ROM needed), and whatever
# ROM-free test steps exist. Anything needing ROMs stays local.

name: build

on: [push, pull_request]

jobs:
  macos:
    # macOS needs nothing beyond Xcode: SDL is Linux-only, CoreAudio and
    # friends ship with the OS. auv3/clap are not in `all`, so they build
    # explicitly (AUV3_ROMS=none: no ROMs in the bundle; running anything
    # still needs them, like everywhere else).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -j$(sysctl -n hw.ncpu) all
      - run: make auv3 AUV3_ROMS=none clap
      - run: python3 tools/check_texts.py
      - run: make test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq build-essential pkg-config
          libasound2-dev libsdl3-dev libfontconfig-dev libcairo2-dev
      - run: make -j$(nproc) all
      - run: python3 tools/check_texts.py
      - run: make test

  windows:
    # Cross-compiled with mingw-w64 (same as `make CROSS=windows` on macOS).
    # Binaries cannot run here, so this job is compile-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq build-essential mingw-w64
      - run: make CROSS=windows -j$(nproc) all

  windows-native:
    # The owner's own setup (MSYS2 mingw64): native build, texts, and the
    # ROM-free test steps, exactly as verified locally before merging.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-make mingw-w64-x86_64-python
      - run: make -j$(nproc) all
      - run: python3 tools/check_texts.py
      - run: make test
